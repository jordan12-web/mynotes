<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="/mynotes/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="mynotes - mobile notes app demo" />

    <!-- Match Flutter logical width to a typical phone (iPhone 14 / 15 class). -->
    <meta
      name="viewport"
      content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="mynotes" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>mynotes</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      :root {
        /* Logical mobile viewport (CSS px) — matches Material breakpoints for phones */
        --mobile-width: 390;
        --mobile-height: 844;
        --phone-scale: 1;
        --bezel: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e8eaed;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .demo-title {
        position: fixed;
        top: 12px;
        left: 0;
        right: 0;
        z-index: 100;
        margin: 0;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        color: #555;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        pointer-events: none;
      }

      /* Scales the entire device chrome to fit the browser window */
      .phone-stage {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 40px 16px 16px;
      }

      .phone {
        position: relative;
        width: calc(var(--mobile-width) * 1px);
        height: calc(var(--mobile-height) * 1px);
        flex: 0 0 auto;
        transform: scale(var(--phone-scale));
        transform-origin: center center;
        border: var(--bezel) solid #111;
        border-radius: 48px;
        background: #111;
        box-shadow:
          0 28px 70px rgba(0, 0, 0, 0.28),
          inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }

      .notch {
        position: absolute;
        top: 0;
        left: 50%;
        z-index: 20;
        width: 120px;
        height: 28px;
        transform: translateX(-50%);
        background: #111;
        border-radius: 0 0 16px 16px;
        pointer-events: none;
      }

      .screen {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 34px;
        background: #042a49;
      }

      /*
       * Fixed-size host: Flutter measures this element for MediaQuery / layout.
       * Do not use max-width / max-height here — scale the outer .phone instead.
       */
      #flutter_host {
        position: absolute;
        top: 0;
        left: 0;
        width: calc(var(--mobile-width) * 1px);
        height: calc(var(--mobile-height) * 1px);
        overflow: hidden;
        background: #042a49;
      }

      #flutter_host flt-glass-pane,
      #flutter_host flt-scene-host,
      #flutter_host > .flt-text-editing-host,
      #flutter_host canvas {
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
      }

      /* Native splash (removed when Flutter calls removeSplashFromWeb) */
      #splash {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #042a49;
        background-image: url("splash/img/light-background.png");
        background-size: cover;
        background-position: center;
        pointer-events: none;
      }

    </style>

    <script id="splash-screen-script">
      function removeSplashFromWeb() {
        document.getElementById("splash")?.remove();
        document.getElementById("splash-branding")?.remove();
      }
    </script>

    <script>
      (function () {
        var MOBILE_W = 390;
        var MOBILE_H = 844;
        var BEZEL = 14;
        var outerW = MOBILE_W + BEZEL * 2;
        var outerH = MOBILE_H + BEZEL * 2;

        function updatePhoneScale() {
          var padX = 32;
          var padY = 56;
          var scale = Math.min(
            1,
            (window.innerWidth - padX) / outerW,
            (window.innerHeight - padY) / outerH,
          );
          document.documentElement.style.setProperty(
            "--phone-scale",
            String(scale),
          );
        }

        window.addEventListener("resize", updatePhoneScale);
        window.addEventListener("orientationchange", updatePhoneScale);
        updatePhoneScale();
      })();
    </script>
  </head>
  <body>
    <p class="demo-title">mynotes</p>

    <div class="phone-stage">
      <div class="phone" aria-label="Phone preview">
        <div class="notch" aria-hidden="true"></div>
        <div class="screen">
          <div id="flutter_host">
            <div id="splash" aria-hidden="true">
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
