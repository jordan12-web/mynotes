<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="/mynotes/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="mynotes" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>mynotes</title>
    <link rel="manifest" href="manifest.json" />

    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <style id="splash-screen-style">
      html {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100%;
        background-color: #042a49;
        background-image: url("splash/img/light-background.png");
        background-size: 100% 100%;
      }

      .center {
        margin: 0;
        position: absolute;
        top: 50%;
        left: 50%;
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
      }

      .contain {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .stretch {
        display: block;
        width: 100%;
        height: 100%;
      }

      .cover {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .bottom {
        position: absolute;
        bottom: 0;
        left: 50%;
        -ms-transform: translate(-50%, 0);
        transform: translate(-50%, 0);
      }

      .bottomLeft {
        position: absolute;
        bottom: 0;
        left: 0;
      }

      .bottomRight {
        position: absolute;
        bottom: 0;
        right: 0;
      }
    </style>
    <style id="phone-mockup-style">
      body {
        margin: 0;
        padding: 20px;
        background: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
      }
      .phone {
        width: 375px;
        height: 667px;
        border: 16px solid #000;
        border-radius: 36px;
        background: #000;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        position: relative;
        overflow: hidden;
      }
      .screen {
        width: 100%;
        height: 100%;
        background: #fff;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
      }
      #flutter_target > * {
        width: 100%;
        height: 100%;
      }
      .notch {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 150px;
        height: 25px;
        background: #000;
        border-radius: 0 0 20px 20px;
        z-index: 10;
      }
      .home-button {
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        background: #000;
        border-radius: 50%;
        z-index: 10;
      }
    </style>
    <script id="splash-screen-script">
      function removeSplashFromWeb() {
        document.getElementById("splash")?.remove();
        document.getElementById("splash-branding")?.remove();
        document.body.style.background = "transparent";
      }
    </script>
  </head>
  <body>
    <div class="phone">
      <div class="notch"></div>
      <div class="screen" id="flutter_target">
        <div id="flutter_placeholder"></div>
      </div>
      <div class="home-button"></div>
    </div>
    <script>
      window.addEventListener("load", function () {
        const screen = document.getElementById("flutter_target");

        const moveFlutterRoot = function () {
          const root = document.querySelector(
            "flt-platform-view, flt-glass-pane, flt-canvas, canvas",
          );
          if (!root || screen.contains(root)) {
            return false;
          }
          screen.appendChild(root);
          return true;
        };

        if (!moveFlutterRoot()) {
          const observer = new MutationObserver(function (mutations, obs) {
            if (moveFlutterRoot()) {
              obs.disconnect();
            }
          });
          observer.observe(document.body, { childList: true, subtree: true });
        }
      });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
