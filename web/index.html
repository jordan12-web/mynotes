<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="mynotes - mobile notes app" />

    <!-- Tall Android logical viewport (Pixel-class, 20:9) -->
    <meta
      name="viewport"
      content="width=412, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="mynotes" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>mynotes</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      :root {
        --mobile-width: 412;
        --mobile-height: 915;
        --phone-scale: 1;
        --bezel: 10px;
        --frame-color: #1c1c1e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(160deg, #dfe4ea 0%, #c8d0d9 100%);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .device-stage {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 20px 16px;
      }

      /* Android-style device chrome */
      .device {
        position: relative;
        width: calc(var(--mobile-width) * 1px);
        height: calc(var(--mobile-height) * 1px);
        flex: 0 0 auto;
        transform: scale(var(--phone-scale));
        transform-origin: center center;
        border: var(--bezel) solid var(--frame-color);
        border-radius: 28px;
        background: var(--frame-color);
        box-shadow:
          0 32px 80px rgba(0, 0, 0, 0.25),
          0 0 0 1px rgba(255, 255, 255, 0.06) inset;
      }

      /* Small punch-hole camera (not a large notch) */
      .camera-hole {
        position: absolute;
        top: 22px;
        left: 50%;
        z-index: 20;
        width: 11px;
        height: 11px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: #0a0a0a;
        box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.15);
        pointer-events: none;
      }

      /* Android gesture navigation bar */
      .gesture-bar {
        position: absolute;
        bottom: 10px;
        left: 50%;
        z-index: 20;
        width: 108px;
        height: 4px;
        transform: translateX(-50%);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.45);
        pointer-events: none;
      }

      .screen {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 20px;
        background: #042a49;
      }

      #flutter_host {
        position: absolute;
        top: 0;
        left: 0;
        width: calc(var(--mobile-width) * 1px);
        height: calc(var(--mobile-height) * 1px);
        overflow: hidden;
        background: #f4f7f9;
      }

      #flutter_host flt-glass-pane,
      #flutter_host flt-scene-host,
      #flutter_host > .flt-text-editing-host,
      #flutter_host canvas {
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
      }

      #splash {
        position: absolute;
        inset: 0;
        z-index: 10;
        background-color: #042a49;
        background-image: url("splash/img/light-background.png");
        background-size: cover;
        background-position: center;
        pointer-events: none;
      }
    </style>

    <script id="splash-screen-script">
      function removeSplashFromWeb() {
        document.getElementById("splash")?.remove();
        document.getElementById("splash-branding")?.remove();
      }
    </script>

    <script>
      (function () {
        var MOBILE_W = 412;
        var MOBILE_H = 915;
        var BEZEL = 10;
        var outerW = MOBILE_W + BEZEL * 2;
        var outerH = MOBILE_H + BEZEL * 2;

        function updatePhoneScale() {
          var padX = 24;
          var padY = 32;
          var scale = Math.min(
            1,
            (window.innerWidth - padX) / outerW,
            (window.innerHeight - padY) / outerH,
          );
          document.documentElement.style.setProperty(
            "--phone-scale",
            String(scale),
          );
        }

        window.addEventListener("resize", updatePhoneScale);
        window.addEventListener("orientationchange", updatePhoneScale);
        updatePhoneScale();
      })();
    </script>
  </head>
  <body>
    <div class="device-stage">
      <div class="device" aria-label="Android phone preview">
        <div class="camera-hole" aria-hidden="true"></div>
        <div class="screen">
          <div id="flutter_host">
            <div id="splash" aria-hidden="true"></div>
          </div>
        </div>
        <div class="gesture-bar" aria-hidden="true"></div>
      </div>
    </div>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
